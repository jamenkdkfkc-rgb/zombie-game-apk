<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ซอมบี้สวนยาง</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=K2D:wght@600;800&family=Sarabun:wght@400;600&display=swap">
<style>
:root{color-scheme:dark;--ink:#e8f0ea;--mut:#9fb3a6;--blood:#d2452b;--amber:#f0b44a;--panel:rgba(8,14,12,.88)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#070b0d;color:var(--ink);font:400 16px/1.5 Sarabun,Tahoma,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#pad{position:fixed;inset:0;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font:800 18px K2D,Tahoma,sans-serif;text-shadow:0 1px 4px #000}
.hud small{display:block;font:400 13px Sarabun,Tahoma,sans-serif;color:var(--mut)}
.hpw{width:130px;height:12px;border-radius:6px;background:rgba(0,0,0,.55);border:1px solid #ffffff33;overflow:hidden;margin-top:4px}
.hpw.sp{height:6px;width:110px;margin-top:3px}
#hp{height:100%;width:100%;background:var(--blood);transition:width .2s}
#sp{height:100%;width:100%;background:#7ac36a}
#am{color:var(--amber);text-align:right}
#rd{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 64px);width:90px;height:90px;pointer-events:none}
#cx{position:fixed;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;pointer-events:none}
#cx:before,#cx:after{content:"";position:absolute;background:#fff;opacity:.85}
#cx:before{left:10px;top:0;width:2px;height:22px}#cx:after{top:10px;left:0;height:2px;width:22px}
#cx.hit:before,#cx.hit:after{background:var(--blood);opacity:1}
#dmg{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(transparent 40%,rgba(190,20,10,.8))}
#bn{position:fixed;left:0;right:0;top:24%;text-align:center;font:800 34px K2D,Tahoma,sans-serif;pointer-events:none;opacity:0;transition:opacity .4s;text-shadow:0 2px 10px #000}
.btn{position:fixed;border-radius:50%;border:2px solid #ffffff55;background:rgba(210,69,43,.55);color:#fff;font:800 16px K2D,Tahoma,sans-serif;touch-action:none;display:none;align-items:center;justify-content:center;padding:0}
#fb{right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:92px;height:92px}
#rb{right:calc(env(safe-area-inset-right,0px) + 126px);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:58px;height:58px;background:rgba(40,60,50,.6);font-size:13px}
#jp{right:calc(env(safe-area-inset-right,0px) + 28px);bottom:calc(env(safe-area-inset-bottom,0px) + 146px);width:66px;height:66px;background:rgba(40,90,140,.65);font-size:13px}
#cr{right:calc(env(safe-area-inset-right,0px) + 108px);bottom:calc(env(safe-area-inset-bottom,0px) + 108px);width:58px;height:58px;background:rgba(40,60,50,.6);font-size:13px}
#sb{left:calc(env(safe-area-inset-left,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);width:64px;height:64px;background:rgba(60,120,60,.6);font-size:13px}
#vb{left:calc(env(safe-area-inset-left,0px) + 26px);bottom:calc(env(safe-area-inset-bottom,0px) + 228px);width:56px;height:56px;background:rgba(60,60,110,.65);font-size:12px}
#cr.on,#sb.on,#vb.on{background:rgba(240,180,74,.85);color:#000}
#vb{left:calc(env(safe-area-inset-left,0px) + 26px);bottom:calc(env(safe-area-inset-bottom,0px) + 228px);width:54px;height:54px;background:rgba(70,70,130,.65);font-size:12px}
body.t .btn{display:flex}
#jb,#jk{position:fixed;border-radius:50%;pointer-events:none;display:none}
#jb{width:100px;height:100px;border:2px solid #ffffff44;margin:-50px 0 0 -50px}
#jk{width:44px;height:44px;background:#ffffff55;margin:-22px 0 0 -22px}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,8,7,.82);padding:20px;z-index:8}
#ov .box{max-width:380px;background:var(--panel);border:1px solid #ffffff22;border-radius:16px;padding:24px;text-align:center}
#ov h1{font:800 34px/1.15 K2D,Tahoma,sans-serif;margin:0 0 8px;color:var(--blood)}
#ov p{margin:0 0 16px;color:var(--mut)}
#ov button,#start{font:800 20px K2D,Tahoma,sans-serif;padding:12px 26px;border-radius:12px;border:0;background:var(--blood);color:#fff;margin:4px}
#ov button.alt{background:#2a3a34}
/* lobby */
#lobby{position:fixed;inset:0;display:flex;flex-direction:column;background:#050a0b;z-index:5}
body:not(.lb) #lobby{display:none}
body.lb .hud,body.lb #cx,body.lb .btn,body.lb #rd,body.lb #pad,body.lb #c{display:none!important}
.lt{padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;display:flex;justify-content:space-between;align-items:baseline;font:800 26px K2D,Tahoma,sans-serif;color:var(--blood);text-shadow:0 2px 8px #000}
.lt small{font:400 13px Sarabun,Tahoma,sans-serif;color:var(--mut)}
#lw{position:relative;flex:1;min-height:0}
#lc{position:absolute;inset:0;width:100%;height:100%}
#sw{position:absolute;left:14px;top:10px;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut)}
#sw i{width:28px;height:28px;border-radius:50%;border:2px solid #fff4;display:block}
#sw i.on{border-color:var(--amber);box-shadow:0 0 0 2px #0008}
#ws{position:absolute;right:12px;top:10px;width:158px;background:rgba(0,0,0,.5);border:1px solid #ffffff1a;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.35}
#ws b{font:800 15px K2D,Tahoma,sans-serif;color:var(--amber)}
#ws small{color:var(--mut);display:block;margin:2px 0 6px}
.bar{height:6px;background:#ffffff22;border-radius:3px;margin:2px 0 6px}
.bar i{display:block;height:100%;background:var(--amber);border-radius:3px}
#wl{display:flex;gap:10px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
#wl::-webkit-scrollbar{display:none}
.wc{flex:0 0 138px;border:2px solid #ffffff22;border-radius:12px;background:#0b1412;padding:6px 8px;text-align:center}
.wc canvas{width:100%;height:auto;display:block}
.wc b{display:block;font:800 14px K2D,Tahoma,sans-serif}
.wc small{color:var(--mut);font-size:12px}
.wc.on{border-color:var(--amber);background:#1a1710}
#start{display:block;margin:4px 14px calc(env(safe-area-inset-bottom,0px) + 14px);padding:14px;font-size:22px}
</style>
</head>
<body class="lb">
<canvas id="c"></canvas>
<div id="pad"></div>
<div class="hud">
  <div>เลือด<div class="hpw"><div id="hp"></div></div><div class="hpw sp"><div id="sp"></div></div><small id="st"></small></div>
  <div id="am"><span id="amt"></span><small id="wn"></small></div>
</div>
<canvas id="rd" width="180" height="180"></canvas>
<div id="cx"></div>
<div id="dmg"></div>
<div id="bn"></div>
<div id="jb"></div><div id="jk"></div>
<button class="btn" id="fb">ยิง</button>
<button class="btn" id="rb">รีโหลด</button>
<button class="btn" id="jp">กระโดด</button>
<button class="btn" id="cr">นั่ง</button>
<button class="btn" id="sb">วิ่ง</button>
<button class="btn" id="vb">มุมมอง</button>
<button class="btn" id="vb">มุมมอง</button>

<div id="lobby">
  <div class="lt"><span>ซอมบี้สวนยาง</span><small id="lbs"></small></div>
  <div id="lw">
    <canvas id="lc"></canvas>
    <div id="sw"></div>
    <div id="ws"></div>
  </div>
  <div id="wl"></div>
  <button id="start">เริ่มภารกิจ</button>
</div>

<div id="ov"><div class="box">
  <h1 id="ovT">คุณตายแล้ว</h1>
  <p id="ovP"></p>
  <button id="again">เล่นใหม่</button><button id="tolobby" class="alt">กลับล็อบบี้</button>
</div></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];
const rgb=a=>'rgb('+a[0]+','+a[1]+','+a[2]+')';
const cv=$('c'),g=cv.getContext('2d');
const lc=$('lc'),lg=lc.getContext('2d');
const TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(TOUCH)document.body.classList.add('t');
let W=0,H=0,F=1,hor=0,camh=1.65,SN=0,CS=1,DPR=1,lw_=0,lh_=0;
function sizeLobby(){const w=$('lw');if(!w)return;lw_=w.clientWidth;lh_=w.clientHeight;lc.width=Math.max(1,lw_*DPR);lc.height=Math.max(1,lh_*DPR)}
function rs(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);F=Math.min(W,H)*(W>H?1.05:1);sizeLobby()}
addEventListener('resize',rs);rs();
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ================= helpers ================= */
const FOG=[20,41,46];
const fogT=d=>Math.pow(clamp((d-4)/52,0,1),.85);
function mx(c,t,fl){fl=fl||0;const r=c[0]+(FOG[0]-c[0])*t+110*fl,gg=c[1]+(FOG[1]-c[1])*t+110*fl,b=c[2]+(FOG[2]-c[2])*t+110*fl;return'rgb('+(clamp(r,0,255)|0)+','+(clamp(gg,0,255)|0)+','+(clamp(b,0,255)|0)+')'}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function poly(c,p,f,s,lw){c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.closePath();if(f){c.fillStyle=f;c.fill()}if(s){c.strokeStyle=s;c.lineWidth=lw||.7;c.stroke()}}
function rr(c,x,y,w,h,r,f,s){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);if(f){c.fillStyle=f;c.fill()}if(s){c.strokeStyle=s;c.lineWidth=.7;c.stroke()}}
function lgv(c,y0,y1,a,b,d){const q=c.createLinearGradient(0,y0,0,y1);q.addColorStop(0,a);q.addColorStop(.45,b);q.addColorStop(1,d);return q}

/* ================= world (300 x 300 m) ================= */
const MAP=150,CELL=6,grid=new Map(),posts=[];
const RN=rng(11);
function gadd(p){const k=Math.floor((p.x+MAP)/CELL)*1000+Math.floor((p.z+MAP)/CELL);let a=grid.get(k);if(!a)grid.set(k,a=[]);a.push(p)}
for(let i=-24;i<=24;i++)for(let j=-24;j<=24;j++){
  const x=i*6+(RN()-.5)*2.6,z=j*6+(RN()-.5)*2.6;
  if(Math.hypot(x,z)<5||Math.abs(x)>MAP-3||Math.abs(z)>MAP-3)continue;
  if(Math.sin(x*.045)*Math.cos(z*.05)>.78)continue;
  gadd({k:0,x,z,h:3.6+RN()*1.1,lean:(RN()-.5)*.12,tone:RN(),cup:RN()<.75,sd:RN()*10});
}
for(let i=0;i<4200;i++)gadd({k:1,x:(RN()*2-1)*MAP,z:(RN()*2-1)*MAP,r:.5+RN()*1.4,c:RN()*4|0});
for(let i=0;i<3200;i++)gadd({k:2,x:(RN()*2-1)*MAP,z:(RN()*2-1)*MAP,h:.25+RN()*.4,c:RN()});
for(let side=0;side<4;side++){let prev=null;for(let t=-MAP;t<=MAP;t+=4){const p=side===0?{x:t,z:-MAP}:side===1?{x:t,z:MAP}:side===2?{x:-MAP,z:t}:{x:MAP,z:t};p.k=3;p.nx=null;if(prev)prev.nx=p;prev=p;posts.push(p)}}
const stars=[];for(let i=0;i<90;i++)stars.push({a:(RN()*2-1)*Math.PI,h:RN()*.9+.08,s:RN()*1.4+.5,p:RN()*6});
const FFL=[];for(let i=0;i<34;i++)FFL.push({x:RN(),y:RN(),p:RN()*6,v:.02+RN()*.04});
function eachNear(maxD,fn){const cx=Math.floor((P.x+MAP)/CELL),cz=Math.floor((P.z+MAP)/CELL),n=Math.ceil(maxD/CELL);for(let i=cx-n;i<=cx+n;i++)for(let j=cz-n;j<=cz+n;j++){const a=grid.get(i*1000+j);if(a)for(let q=0;q<a.length;q++)fn(a[q])}}
function push(o,r){const cx=Math.floor((o.x+MAP)/CELL),cz=Math.floor((o.z+MAP)/CELL);for(let i=cx-1;i<=cx+1;i++)for(let j=cz-1;j<=cz+1;j++){const a=grid.get(i*1000+j);if(!a)continue;for(const t of a){if(t.k!==0)continue;const dx=o.x-t.x,dz=o.z-t.z;if(dx>1.5||dx<-1.5||dz>1.5||dz<-1.5)continue;const d=Math.hypot(dx,dz),m=r+.2;if(d<m&&d>1e-4){o.x+=dx/d*(m-d);o.z+=dz/d*(m-d)}}}}

/* ================= weapons ================= */
const WP={
 m1911:{n:'ปืนพก M1911',en:'COLT M1911',d:'ปืนพก .45 คลาสสิก ดาเมจแรง ยิงทีละนัด',dmg:38,rate:.27,auto:false,mag:8,res:80,rl:1.3,rec:.032,spread:.012,pel:1,fs:1.35,gs:.0088,o:[-1,9],mz:[29,-8],hg:[3,9],cx:8,cy:3,len:50,snd:[.14,3600,.3,170],mv:1},
 ak47:{n:'ปืนยาว AK-47',en:'AK-47',d:'ไรเฟิลสมดุล ดาเมจดี ยิงรัวคุมง่าย',dmg:30,rate:.11,auto:true,mag:30,res:180,rl:2.1,rec:.017,spread:.014,pel:1,fs:1,gs:.0078,o:[-17,14],mz:[60,-5.5],hg:[20,0],cx:0,cy:4,len:122,snd:[.12,3000,.28,120],mv:.95},
 m249:{n:'ปืนกล M249',en:'M249 SAW',d:'ปืนกลเบา กระสุน 100 นัด ยิงรัวสะใจ แต่หนักและรีโหลดนาน',dmg:26,rate:.075,auto:true,mag:100,res:300,rl:3.8,rec:.012,spread:.02,pel:1,fs:.92,gs:.0074,o:[-20,15],mz:[67,-5],hg:[24,-1],cx:2,cy:5,len:136,snd:[.1,2400,.3,90],mv:.82},
 moss:{n:'ปืนลูกซอง Mossberg',en:'MOSSBERG 590',d:'ระยะใกล้แรงมาก กระสุนแตก 8 ลูก',dmg:17,rate:.85,auto:false,mag:6,res:54,rl:2.4,rec:.07,spread:.075,pel:8,fs:.9,gs:.0072,o:[-24,6],mz:[72,-7],hg:[30,1],cx:4,cy:0,len:140,snd:[.28,1800,.45,70],mv:.95}
};
const ORDER=['m1911','ak47','m249','moss'];
const OUT=[{c:[74,92,62],v:[40,48,42],p:[58,66,50]},{c:[48,52,62],v:[24,26,32],p:[34,36,44]},{c:[158,134,96],v:[110,92,64],p:[120,104,76]},{c:[142,50,42],v:[66,24,22],p:[50,40,40]}];
let sel='ak47',outfit=0,best=0,cur='ak47';
try{sel=localStorage.getItem('zr_sel')||sel;outfit=+localStorage.getItem('zr_out')||0;best=+localStorage.getItem('zr_best')||0}catch(e){}
if(!WP[sel])sel='ak47';

/* drawn side-on, muzzle pointing +x, y down */
function drawGun(c,k,flash){
  const w=WP[k];
  c.lineJoin='round';
  if(k==='ak47'){
    poly(c,[-56,-7,-30,-8,-30,5,-46,15,-57,14],lgv(c,-8,15,'#a0622e','#7a4420','#4a2814'),'#2a1608');
    poly(c,[-58,-7,-55,-7,-55.5,14,-58.5,14],'#161616');
    poly(c,[-6,5,6,5,17,26,25,35,16,37,4,28],lgv(c,5,37,'#55595f','#34373b','#1b1c1e'),'#101112');
    c.strokeStyle='rgba(0,0,0,.45)';c.lineWidth=.8;for(let i=0;i<4;i++){c.beginPath();c.moveTo(0+i*4.5,10+i*5.5);c.lineTo(10+i*4.2,10+i*5.5);c.stroke()}
    poly(c,[-24,5,-14,5,-10,22,-20,23],lgv(c,5,23,'#8a5428','#5e3618','#3a200e'),'#20120a');
    rr(c,-30,-10,36,15,1.5,lgv(c,-10,5,'#60666d','#383b40','#202226'),'#101112');
    poly(c,[-28,-12,-4,-12,4,-9,-30,-9],lgv(c,-12,-9,'#6f747b','#4c5056','#383b40'),'#111');
    rr(c,-10,-16,6,4.5,1,'#2c2e31');rr(c,-18,-5,10,3,1,'#0e0f10');rr(c,-4,-8,5,2,1,'#555a60');
    c.strokeStyle='#202226';c.lineWidth=1.6;c.beginPath();c.moveTo(-14,5);c.quadraticCurveTo(-12,13,-6,11);c.lineTo(-4,5);c.stroke();
    poly(c,[4,-6,34,-5,34,3,4,5],lgv(c,-6,5,'#b06a34','#8a4e26','#583018'),'#2a1608');
    poly(c,[6,-10,32,-9,32,-5,6,-6],lgv(c,-10,-5,'#a05e2c','#7a4420','#5a3218'),'#2a1608');
    c.strokeStyle='rgba(40,20,8,.45)';c.lineWidth=.6;for(let i=0;i<3;i++){c.beginPath();c.moveTo(7,-3+i*3);c.quadraticCurveTo(20,-4+i*3,33,-3+i*3);c.stroke()}
    rr(c,6,-13,28,3,1.5,'#2d2f33');rr(c,32,-13,6,9,1,'#2a2c30');
    rr(c,34,-7,22,3.5,1,lgv(c,-7,-3.5,'#4c5056','#2a2c30','#1a1b1d'));
    rr(c,46,-15,2.5,9,.8,'#1c1d1f');rr(c,54,-9,6,7,1,'#1c1d1f');
  }else if(k==='m249'){
    poly(c,[-64,-6,-36,-9,-36,6,-46,8,-52,16,-62,14],lgv(c,-9,16,'#3c423c','#262a26','#161916'),'#0c0e0c');
    poly(c,[-65,-6,-62,-6,-62.5,15,-65,14],'#111');
    rr(c,-12,7,22,24,2,lgv(c,7,31,'#5e6652','#3d4434','#252a1f'),'#10130d');
    c.strokeStyle='rgba(0,0,0,.4)';c.lineWidth=.8;for(let i=0;i<4;i++){c.beginPath();c.moveTo(-11,12+i*5);c.lineTo(9,12+i*5);c.stroke()}
    rr(c,-36,-10,44,17,2,lgv(c,-10,7,'#4d534d','#2c312c','#181b18'),'#0c0e0c');
    poly(c,[-14,-16,6,-16,10,-10,-18,-10],lgv(c,-16,-10,'#5c635c','#3a403a','#262a26'),'#0c0e0c');
    for(let i=0;i<4;i++)rr(c,-16+i*3.6,-6+i*.6,2.6,5,.8,'#c9a24a');
    poly(c,[-26,7,-16,7,-13,24,-24,25],lgv(c,7,25,'#3c423c','#262a26','#151815'),'#0a0c0a');
    c.strokeStyle='#1a1d1a';c.lineWidth=1.6;c.beginPath();c.moveTo(-14,7);c.quadraticCurveTo(-10,14,-4,12);c.lineTo(-2,7);c.stroke();
    poly(c,[8,-9,36,-8,36,4,8,6],lgv(c,-9,6,'#4e554e','#2d322d','#181b18'),'#0a0c0a');
    for(let i=0;i<5;i++)rr(c,12+i*5,-5,2.6,7,1,'#090b09');
    c.strokeStyle='#22261f';c.lineWidth=2.6;c.beginPath();c.moveTo(12,-9);c.lineTo(14,-17);c.lineTo(30,-17);c.lineTo(32,-8);c.stroke();
    rr(c,36,-7,26,4,1,'#1f221f');rr(c,36,-11,9,9,1,'#2a2e2a');rr(c,61,-9.5,7,8,1,'#151815');
    c.strokeStyle='#252525';c.lineWidth=1.5;c.beginPath();c.moveTo(42,-2);c.lineTo(60,4);c.moveTo(45,-2);c.lineTo(62,5);c.stroke();
    rr(c,57,-12.5,2.5,5,.8,'#111');rr(c,-4,-19,4,3,1,'#111');
  }else if(k==='moss'){
    poly(c,[-64,-5,-30,-6,-30,3,-40,6,-52,16,-62,14],lgv(c,-6,16,'#34383d','#222529','#131518'),'#0a0b0d');

  for(let p=0;p<w.pel;p++)hitscan((Math.random()*2-1)*sprd,(Math.random()*2-1)*sprd,w);
  const k=w.rec*(1-.35*P.cr)*(.7+Math.random()*.6);P.pitch=clamp(P.pitch+k,-.6,.6);P.yaw+=(Math.random()-.5)*w.rec*.7;recoilV=1;shk=Math.max(shk,w.pel>1?.7:.3);
}
function hitscan(a,b,w){
  let bz=null,bd=1e9,by=0;const ch=camH();
  for(const z of Z){const q=rel(z);if(q.d<.3||q.d>90)continue;const y=ch+(P.pitch+b)*q.d,sc=z.look.sc,tol=(.3+.012*q.d)*sc*(z.look.w>1.2?1.2:1);
    if(Math.abs(q.r-a*q.d)<tol&&y>-.05&&y<1.95*sc&&q.d<bd){bz=z;bd=q.d;by=y/sc}}
  let td=1e9;
  eachNear(Math.min(bd,70)+2,p=>{if(p.k!==0)return;const q=rel(p);if(q.d>.3&&q.d<td&&q.d<bd&&Math.abs(q.r-a*q.d)<.2){const y=ch+(P.pitch+b)*q.d;if(y>0&&y<p.h)td=q.d}});
  const wx=d=>CX+SN*d+CS*a*d,wz=d=>CZ+CS*d-SN*a*d,wy=d=>ch+(P.pitch+b)*d;
  if(td<bd){burst(wx(td),clamp(wy(td),.1,3),wz(td),5,'rgb(120,96,70)',1.6,.03,5);return}
  if(!bz)return;
  const head=by>1.45,leg=by<.8;
  let dmg=w.dmg*(head?2.5:leg?.75:1);if(w.pel>1)dmg*=1-clamp((bd-8)/30,0,.65);
  bz.hp-=dmg;bz.flash=.12;bz.hit=.12;bz.hurt=2.5;
  const q=rel(bz),kd=.12;bz.x+=SN*kd;bz.z+=CS*kd;
  const hx=wx(bd),hy=clamp(by*bz.look.sc,.2,2.1),hz=wz(bd);
  burst(hx,hy,hz,head?9:6,'rgb(150,14,14)',head?2.6:1.8,.035,9);
  TX.push({x:hx,y:hy+.2,z:hz,t:Math.round(dmg)+'',life:.9,max:.9,col:head?'#ffd34a':'#fff',big:head});
  $('cx').classList.add('hit');hitT=.12;
  if(bz.hp<=0){
    const i=Z.indexOf(bz);if(i>=0)Z.splice(i,1);
    D.push({x:bz.x,z:bz.z,look:bz.look,ph:bz.ph,dir:Math.random()<.5?-1:1,t:0,type:bz.type,flash:0});
    score+=head?15:10;kills++;
    if(Math.random()<.3)PK.push({x:bz.x,z:bz.z,t:Math.random()<.65?'a':'h'});
    burst(hx,hy,hz,12,'rgb(120,10,10)',3,.04,9);
  }
}

/* ================= update ================= */
function update(dt){
  tp+=((tpWant?1:0)-tp)*Math.min(1,dt*6);camSet();
  const w=WP[cur];
  recoilV=Math.max(0,recoilV-dt*7);cd-=dt;flash-=dt;hitT-=dt;shk=Math.max(0,shk-dt*3);if(hitT<=0)$('cx').classList.remove('hit');
  const crT=(crouchT||keys.KeyC||keys.ControlLeft)?1:0;P.cr+=(crT-P.cr)*Math.min(1,dt*12);
  keyMove=((keys.KeyW||keys.ArrowUp)||(keys.KeyS||keys.ArrowDown)||(keys.KeyA||keys.ArrowLeft)||(keys.KeyD||keys.ArrowRight))?1:0;
  let fi=-jy+((keys.KeyW||keys.ArrowUp)?1:0)-((keys.KeyS||keys.ArrowDown)?1:0);
  let si=jx+((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0);
  const mv=Math.min(1,Math.hypot(fi,si));if(mv>1e-4&&Math.hypot(fi,si)>1){const l=Math.hypot(fi,si);fi/=l;si/=l}
  const wantSpr=sprintT||keys.ShiftLeft||keys.ShiftRight;let isSpr=false;
  if(wantSpr&&fi>.3&&P.cr<.3&&!exh&&stam>0){isSpr=true;stam=Math.max(0,stam-24*dt);if(stam<=0)exh=true}
  else{stam=Math.min(100,stam+(wantSpr?8:16)*dt);if(exh&&stam>25)exh=false}
  if(sprintT&&mv<.1)cancelSprint();
  spr+=((isSpr&&!firing?1:0)-spr)*Math.min(1,dt*8);
  const sp=4.2*(1-.5*P.cr)*(isSpr?1.75:1)*w.mv;
  P.x=clamp(P.x+(SN*fi+CS*si)*sp*dt,-MAP+1.5,MAP-1.5);P.z=clamp(P.z+(CS*fi-SN*si)*sp*dt,-MAP+1.5,MAP-1.5);
  push(P,.35);
  if(P.y>0||P.vy>0){P.vy-=15*dt;P.y+=P.vy*dt;if(P.y<=0){P.y=0;P.vy=0}}
  if(P.y===0)bobT+=mv*dt*(isSpr?14:9)*(1-.4*P.cr);
  sprd=w.spread*(1+mv*.9+(P.y>0?1.5:0)+(isSpr?.8:0))*(1-.4*P.cr);

  if(reloading){rt-=dt;if(rt<=0){const t=Math.min(w.mag-ammo,res);ammo+=t;res-=t;reloading=false;noise(.05,4000,.2)}}
  if(firing&&cd<=0&&!reloading&&spr<.6){if(ammo>0){if(w.auto||trig){shoot();trig=false}}else{reload();trig=false}}

  if(toSpawn>0){spawnT-=dt;if(spawnT<=0){spawnZ();toSpawn--;spawnT=1.1}}
  else if(Z.length===0){waveWait-=dt;if(waveWait<=0)nextWave()}

  let near=1e9;
  for(const z of Z){
    z.ph+=dt*z.spd*2.6;z.flash-=dt;z.hit-=dt;z.claw-=dt;z.hurt-=dt;
    const dx=P.x-z.x,dz=P.z-z.z,d=Math.hypot(dx,dz);near=Math.min(near,d);
    if(d>.9){z.x+=dx/d*z.spd*dt;z.z+=dz/d*z.spd*dt}
    for(const o of Z){if(o===z)continue;const ox=z.x-o.x,oz=z.z-o.z,od=Math.hypot(ox,oz);if(od<.7&&od>1e-4){z.x+=ox/od*dt*1.4;z.z+=oz/od*dt*1.4}}
    push(z,.3);
    if(d<1.2&&P.y<.5){z.atk-=dt;z.claw=Math.max(z.claw,.1);if(z.atk<=0){P.hp-=z.dmg;dmgA=1;shk=Math.max(shk,.8);z.atk=.9;z.claw=.3;HD.push({x:z.x,z:z.z,t:1.2})}}else z.atk=Math.max(z.atk,.3);
  }
  groanT-=dt;if(groanT<=0&&near<16){groan();groanT=rnd(2.5,5)}
  for(let i=D.length-1;i>=0;i--){D[i].t+=dt;if(D[i].t>6.5)D.splice(i,1)}
  for(let i=PK.length-1;i>=0;i--){const p=PK[i];if(Math.hypot(p.x-P.x,p.z-P.z)<1.2){if(p.t==='a'){res+=Math.ceil(w.mag*.8);banner('+กระสุน',900)}else{P.hp=Math.min(100,P.hp+30);banner('+เลือด',900)}PK.splice(i,1)}}
  for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.life-=dt;if(p.life<=0){PT.splice(i,1);continue}p.vy-=p.gr*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;if(p.y<.02){p.y=.02;p.vx*=.4;p.vz*=.4;p.vy=0}}
  for(let i=TX.length-1;i>=0;i--){TX[i].life-=dt;if(TX[i].life<=0)TX.splice(i,1)}
  for(let i=HD.length-1;i>=0;i--){HD[i].t-=dt;if(HD[i].t<=0)HD.splice(i,1)}
  dmgA=Math.max(0,dmgA-dt*1.6);
  if(P.hp<=0)gameOver();
}
function gameOver(){
  running=false;firing=false;trig=false;joyReset();if(document.exitPointerLock)document.exitPointerLock();
  if(wave>best){best=wave;try{localStorage.setItem('zr_best',best)}catch(e){}}
  $('ovP').innerHTML='รอดถึงคลื่นที่ '+wave+' · ฆ่าซอมบี้ '+kills+' ตัว<br>แต้มรวม '+score+' · คลื่นสูงสุด '+best;$('ov').style.display='flex';
}

function ridge(base,amp,col,k){g.fillStyle=col;g.beginPath();g.moveTo(0,hor+2);for(let x=0;x<=W+8;x+=8){const a=P.yaw+Math.atan((x-W/2)/F),hh=base+amp*(.55*Math.sin(a*3+k)+.3*Math.sin(a*7+k*2)+.15*Math.sin(a*13+k*3));g.lineTo(x,hor-hh*F)}g.lineTo(W+8,hor+2);g.closePath();g.fill()}
const PC=[[58,38,24],[74,50,28],[40,52,30],[48,40,28]];
const ITEMS=[],PAT=[];

  g.save();g.translate(-w.o[0],-w.o[1]);drawGun(g,cur,flash);g.restore();

function render(t){
  camSet();
  hor=H/2+P.pitch*F;camh=camH();
  g.save();
  if(shk>0)g.translate(rnd(-1,1)*shk*5,rnd(-1,1)*shk*5);
  let q=g.createLinearGradient(0,hor-F*1.2,0,hor);q.addColorStop(0,'#03060d');q.addColorStop(1,'#14292e');
  g.fillStyle=q;g.fillRect(-10,-10,W+20,Math.max(0,Math.min(H,hor))+12);
  for(const s of stars){let da=s.a-P.yaw;da=Math.atan2(Math.sin(da),Math.cos(da));if(Math.abs(da)>1.4)continue;const x=W/2+Math.tan(da)*F,y=hor-s.h*F*1.2;if(y<hor-4){g.globalAlpha=.5+.4*Math.sin(t/700+s.p);g.fillStyle='#fff';g.fillRect(x,y,s.s,s.s)}}g.globalAlpha=1;
  let da=.6-P.yaw;da=Math.atan2(Math.sin(da),Math.cos(da));
  if(Math.abs(da)<1.3){const mx_=W/2+Math.tan(da)*F,my=hor-F*.7;q=g.createRadialGradient(mx_,my,2,mx_,my,F*.35);q.addColorStop(0,'rgba(210,230,220,.45)');q.addColorStop(1,'rgba(210,230,220,0)');g.fillStyle=q;g.fillRect(mx_-F*.4,my-F*.4,F*.8,F*.8);g.fillStyle='#e8eed8';g.beginPath();g.arc(mx_,my,F*.05,0,6.283);g.fill();g.fillStyle='#cfd8c0';g.beginPath();g.arc(mx_+F*.012,my-F*.006,F*.04,0,6.283);g.fill()}
  ridge(.05,.07,'#0d1c22',1);ridge(.02,.05,'#0b1a1d',4);
  if(hor<H){const y0=Math.max(-10,hor);q=g.createLinearGradient(0,hor,0,hor+F*.9);q.addColorStop(0,'#14292e');q.addColorStop(1,'#1b2616');g.fillStyle=q;g.fillRect(-10,y0,W+20,H-y0+10)}
  q=g.createLinearGradient(0,hor-F*.07,0,hor+F*.04);q.addColorStop(0,'rgba(34,62,64,0)');q.addColorStop(.6,'rgba(34,62,64,.5)');q.addColorStop(1,'rgba(34,62,64,0)');g.fillStyle=q;g.fillRect(-10,hor-F*.07,W+20,F*.11);

  ITEMS.length=0;PAT.length=0;const hw=W/(2*F);
  eachNear(60,p=>{const dx=p.x-CX,dz=p.z-CZ,d=dx*SN+dz*CS;if(d<.4||d>56)return;const rr_=dx*CS-dz*SN;
    if(p.k===1){if(d<34&&Math.abs(rr_)<d*hw+p.r+2)PAT.push({p,d,r:rr_});return}
    if(p.k===2&&d>28)return;
    if(Math.abs(rr_)>d*hw+4)return;ITEMS.push({d,r:rr_,k:p.k,o:p})});
  for(const p of posts){const dx=p.x-CX,dz=p.z-CZ,d=dx*SN+dz*CS;if(d<.4||d>60)continue;const rr_=dx*CS-dz*SN;if(Math.abs(rr_)>d*hw+4)continue;ITEMS.push({d,r:rr_,k:3,o:p})}
  for(const z of Z){const e=rel(z);if(e.d>.25&&e.d<56)ITEMS.push({d:e.d,r:e.r,k:4,o:z})}
  for(const z of D){const e=rel(z);if(e.d>.25&&e.d<56)ITEMS.push({d:e.d,r:e.r,k:5,o:z})}
  for(const p of PK){const e=rel(p);if(e.d>.25&&e.d<56)ITEMS.push({d:e.d,r:e.r,k:6,o:p})}
  for(const p of PT){const e=rel(p);if(e.d>.25&&e.d<56)ITEMS.push({d:e.d,r:e.r,k:7,o:p})}
  if(tp>.05){const e=rel(P);if(e.d>.3)ITEMS.push({d:e.d,r:e.r,k:8,o:P})}

  ITEMS.sort((a,b)=>b.d-a.d);
  for(const it of ITEMS){switch(it.k){case 0:drawTree(it.o,it.d,it.r);break;case 2:drawTuft(it.o,it.d,it.r);break;case 3:drawPost(it.o,it.d,it.r);break;case 4:drawZombie(it.o,it.d,it.r,false);break;case 5:drawZombie(it.o,it.d,it.r,true);break;case 6:drawPK(it.o,it.d,it.r);break;case 7:drawPT(it.o,it.d,it.r);break;case 8:drawPlayer(it.d,it.r,t);break}}
  for(const f of FFL){const x=((f.x+Math.sin(t/3000+f.p)*.03+P.yaw*.1)%1+1)%1*W,y=(.35+f.y*.5)*H+Math.sin(t/900+f.p)*8;g.globalAlpha=.35+.5*Math.sin(t/500+f.p);g.fillStyle='#d9f58a';g.beginPath();g.arc(x,y,1.5,0,6.283);g.fill()}g.globalAlpha=1;
  /* damage numbers */
  g.textAlign='center';
  for(const tx of TX){const e=rel(tx);if(e.d<.5)continue;const s=F/e.d,px=W/2+e.r*s,py=hor+(camh-tx.y)*s-(1-tx.life/tx.max)*34,a=clamp(tx.life/tx.max*2,0,1),sz=tx.big?28:20;
    g.globalAlpha=a;g.font='800 '+sz+'px K2D,Tahoma,sans-serif';g.lineWidth=4;g.strokeStyle='rgba(0,0,0,.8)';g.strokeText(tx.t,px,py);g.fillStyle=tx.col;g.fillText(tx.t,px,py);g.globalAlpha=1}
  g.restore();
  if(tp<.5)drawFP();
  /* hit direction */
  for(const h of HD){const e=rel(h),a=Math.atan2(e.r,e.d),ca=Math.atan2(-Math.cos(a),Math.sin(a));g.strokeStyle='rgba(220,30,20,'+clamp(h.t,0,1)*.8+')';g.lineWidth=10;g.beginPath();g.arc(W/2,H/2,F*.36,ca-.3,ca+.3);g.stroke()}
  /* hud */
  $('hp').style.width=Math.max(0,P.hp)+'%';$('sp').style.width=stam+'%';$('sp').style.background=exh?'#c8782a':'#7ac36a';
  $('dmg').style.opacity=dmgA;$('cx').style.transform='scale('+(1+sprd*22)+')';
  $('st').textContent='คลื่น '+wave+' · แต้ม '+score+' · เหลือ '+(Z.length+toSpawn);
  $('amt').textContent=reloading?'กำลังโหลด…':ammo+' / '+res;$('wn').textContent=WP[cur].en+' · '+(P.y>.01?'กระโดด':spr>.5?'วิ่ง':P.cr>.5?'นั่ง':'ยืน');
  drawRadar();

const rdc=$('rd'),rdg=rdc.getContext('2d');
function drawRadar(){
  const c=rdg,R=50;c.clearRect(0,0,180,180);c.fillStyle='rgba(0,0,0,.5)';c.beginPath();c.arc(90,90,88,0,6.283);c.fill();c.strokeStyle='rgba(255,255,255,.25)';c.lineWidth=2;c.stroke();
  c.strokeStyle='rgba(255,255,255,.1)';c.lineWidth=1;c.beginPath();c.arc(90,90,44,0,6.283);c.moveTo(90,2);c.lineTo(90,178);c.moveTo(2,90);c.lineTo(178,90);c.stroke();
  for(const z of Z){const e=relP(z),x=e.r/R*88,y=-e.d/R*88,l=Math.hypot(x,y);let px=x,py=y;if(l>84){px=x/l*84;py=y/l*84}c.fillStyle=z.type==='brute'?'#ff8a3a':'#e23a2a';c.beginPath();c.arc(90+px,90+py,l>84?2.5:3.6,0,6.283);c.fill()}

/* ================= input ================= */
const pad=$('pad'),jb=$('jb'),jk=$('jk');
let joyId=null,lookId=null,jx0=0,jy0=0,lx=0,ly=0;
function joyReset(){joyId=null;lookId=null;jx=0;jy=0;jb.style.display=jk.style.display='none'}
pad.addEventListener('pointerdown',e=>{
  if(!running)return;
  if(e.pointerType==='mouse'){firing=true;trig=true;if(!document.pointerLockElement&&pad.requestPointerLock)pad.requestPointerLock();return}
  pad.setPointerCapture(e.pointerId);
  if(e.clientX<innerWidth*.5&&joyId===null){joyId=e.pointerId;jx0=e.clientX;jy0=e.clientY;jb.style.display=jk.style.display='block';jb.style.left=jk.style.left=jx0+'px';jb.style.top=jk.style.top=jy0+'px'}
  else if(lookId===null){lookId=e.pointerId;lx=e.clientX;ly=e.clientY}
});
pad.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'){if(document.pointerLockElement&&running){P.yaw+=e.movementX*.003;P.pitch=clamp(P.pitch-e.movementY*.003,-.6,.6)}return}
  if(e.pointerId===joyId){let dx=e.clientX-jx0,dy=e.clientY-jy0;const l=Math.hypot(dx,dy),m=50;if(l>m){dx=dx/l*m;dy=dy/l*m}jx=dx/m;jy=dy/m;jk.style.left=jx0+dx+'px';jk.style.top=jy0+dy+'px'}
  else if(e.pointerId===lookId){P.yaw+=(e.clientX-lx)*.0055;P.pitch=clamp(P.pitch-(e.clientY-ly)*.0045,-.6,.6);lx=e.clientX;ly=e.clientY}
});
const up=e=>{if(e.pointerType==='mouse'){firing=false;trig=false;return}if(e.pointerId===joyId){joyId=null;jx=0;jy=0;jb.style.display=jk.style.display='none'}if(e.pointerId===lookId)lookId=null};
pad.addEventListener('pointerup',up);pad.addEventListener('pointercancel',up);

/* fire button: hold to shoot AND drag to turn the camera */
const fb=$('fb');let fbId=null,fx=0,fy=0;
fb.addEventListener('pointerdown',e=>{e.preventDefault();try{fb.setPointerCapture(e.pointerId)}catch(x){}fbId=e.pointerId;fx=e.clientX;fy=e.clientY;firing=true;trig=true;cancelSprint()});
fb.addEventListener('pointermove',e=>{if(e.pointerId!==fbId||!running)return;P.yaw+=(e.clientX-fx)*.0055;P.pitch=clamp(P.pitch-(e.clientY-fy)*.0045,-.6,.6);fx=e.clientX;fy=e.clientY});
['pointerup','pointercancel'].forEach(ev=>fb.addEventListener(ev,e=>{if(e.pointerId===fbId){fbId=null;firing=false;trig=false}}));
function hold(el,on){el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(x){}on()})}
hold($('rb'),reload);hold($('jp'),jump);
hold($('cr'),()=>{crouchT=!crouchT;$('cr').classList.toggle('on',crouchT)});
hold($('sb'),()=>{sprintT=!sprintT;$('sb').classList.toggle('on',sprintT)});
function toggleView(){tpWant=!tpWant;$('vb').classList.toggle('on',tpWant)}
hold($('vb'),toggleView);
addEventListener('keydown',e=>{keys[e.code]=true;if(!running)return;if(e.code==='Space'){e.preventDefault();jump()}if(e.code==='KeyR')reload();if(e.code==='KeyV')toggleView()});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{firing=false;trig=false});

/* ================= flow ================= */
function startGame(){
  ac();reset();running=true;lobbyOn=false;
  document.body.classList.remove('lb');$('ov').style.display='none';last=performance.now();
  $('wn').textContent=WP[cur].en;
}
function toLobby(){running=false;lobbyOn=true;document.body.classList.add('lb');$('ov').style.display='none';joyReset();buildLobby();requestAnimationFrame(sizeLobby)}
$('start').addEventListener('click',startGame);
$('again').addEventListener('click',startGame);
$('tolobby').addEventListener('click',toLobby);
function loop(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(running){update(dt);render(t)}else if(lobbyOn)lobbyDraw(t/1000);
  requestAnimationFrame(loop);
}
buildLobby();sizeLobby();
requestAnimationFrame(loop);
