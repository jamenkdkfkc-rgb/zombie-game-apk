
name: Build Zombie Game APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          ./gradlew --version || true

      - name: Find project folder
        run: |
          PKG=$(find . -type f -name package.json \
            -not -path './.git/*' \
            -not -path './node_modules/*' | head -n 1)
          if [ -z "$PKG" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PKG")" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install
          npm install @capacitor/android@^7

      - name: Prepare game
        run: |
          cd "$PROJECT_DIR"
          mkdir -p www
          if [ -f index.html ] && [ ! -f www/index.html ]; then
            cp index.html www/index.html
          fi

      - name: Add Android platform
        run: |
          cd "$PROJECT_DIR"
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zombie-game-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          
